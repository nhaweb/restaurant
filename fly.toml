# Fly.io — PRODUCTION
# Docs: https://fly.io/docs/js/frameworks/nextjs/
#
# First-time setup:
#   fly auth login
#   fly apps create pml-food
#   fly secrets set -a pml-food $(Get-Content .env.fly.example | Where-Object { $_ -match '=' -and $_ -notmatch '^#' -and $_ -notmatch '^NEXT_PUBLIC_' })
#   # Or set secrets one-by-one (server-only keys):
#   fly secrets set SANITY_API_READ_TOKEN=... SUPABASE_SERVICE_ROLE_KEY=... RESEND_API_KEY=... ...
#   fly deploy
#
# Update NEXT_PUBLIC_* build args below to your real production URL before deploy.

app = "pml-food"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://pml-food.fly.dev"
    NEXT_PUBLIC_SANITY_PROJECT_ID = "8aj7sksi"
    NEXT_PUBLIC_SANITY_DATASET = "production"
    NEXT_PUBLIC_SANITY_API_VERSION = "2025-01-01"
    NEXT_PUBLIC_SUPABASE_URL = "https://jnjmldoqrobzgexjxkcl.supabase.co"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
